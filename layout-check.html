<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Portfolio responsive layout check</title><style>*{box-sizing:border-box}body{margin:0;background:#e6e8e4;font:13px system-ui;color:#17251f}header{display:flex;align-items:center;gap:20px;flex-wrap:wrap;padding:12px 22px;min-height:62px;background:#fff;border-bottom:1px solid #cbd1c8}label{display:flex;align-items:center;gap:8px}select{padding:7px;border:1px solid #cbd1c8;border-radius:6px}main{overflow:auto;padding:12px;text-align:center}iframe{display:block;margin:0 auto;border:0;outline:1px solid #9eaa9c;height:820px;background:white;width:390px}p{font-size:11px;color:#657369;margin:0}</style></head><body><header><strong>Responsive layout check</strong><label>Viewport width <select id="viewport" aria-label="Viewport width"><option value="320">320 px</option><option value="360">360 px</option><option value="390" selected>390 px</option><option value="520">520 px</option><option value="768">768 px</option><option value="1024">1024 px</option><option value="1440">1440 px</option></select></label><p>The embedded page renders at the selected width. Its controls work normally.</p></header><main><iframe id="preview" title="Responsive portfolio preview" src="./?v=20261017e"></iframe></main><script>document.getElementById('viewport').addEventListener('change',e=>document.getElementById('preview').style.width=e.target.value+'px');</script></body></html>
